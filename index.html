<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Nota: NO uses placeholders VITE_xxx en atributos del HTML.
      Vite ejecuta decodeURI() sobre los href durante el build de
      producción y rompe con "URI malformed" si hay un porcentaje
      no válido. El título y el favicon se definen dinámicamente
      desde App.jsx usando import.meta.env (con valores por defecto).
    -->
    <title>La Luz de Emi 2</title>
    <link rel="preload" href="/logo.ico" as="image" type="image/x-icon" />
    <link rel="icon" href="/logo.ico?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
